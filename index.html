<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/* ★ 온라인 설정: Firebase 콘솔에서 받은 설정 객체를 아래 null 자리에 붙여넣으세요.
   비워 두면 이 기기 안에서만 동작합니다. */
window.HUB_FIREBASE_CONFIG = {
  apiKey: "AIzaSyBowugsSNCWpuZfB4zO6_vvG_HwliUTy_s",
  authDomain: "game-42cec.firebaseapp.com",
  projectId: "game-42cec",
  storageBucket: "game-42cec.firebasestorage.app",
  messagingSenderId: "573710085576",
  appId: "1:573710085576:web:4f24f82058eb3d4f18a4fd"
};

<script>
/* 둘이서 게임방 · 데이터 어댑터
 * 게임 코드는 window.claude.use("db") / use("user") 로 저장소를 쓰는데,
 * 이 파일이 그 모양과 똑같은 객체를 만들어 줍니다.
 *  - window.HUB_FIREBASE_CONFIG 가 있으면 Firestore 로 기기 간 연결/저장
 *  - 없으면 이 브라우저(localStorage) 안에서만 동작 (같은 브라우저 두 탭으로 테스트 가능)
 * claude.ai Artifact 안에서는 원래의 window.claude 가 이미 있으므로 아무것도 하지 않습니다. */
(function () {
  if (window.claude && typeof window.claude.use === "function") return;

  const CFG = window.HUB_FIREBASE_CONFIG || null;
  let fs = null;
  try {
    if (CFG && CFG.apiKey && window.firebase && firebase.firestore) {
      if (!firebase.apps.length) firebase.initializeApp(CFG);
      fs = firebase.firestore();
      // 모바일 통신망에서 실시간 연결이 막히면 자동으로 긴 폴링 방식으로 바꿔 상대 화면 반영을 안정시킴
      try { fs.settings({ experimentalAutoDetectLongPolling: true, merge: true }); } catch (e) {}
    }
  } catch (e) { fs = null; }
  const LIVE = !!fs;

  // 구글 이름이 저장돼 있으면, 아직 비어 있는 닉네임 저장칸에 먼저 넣어 둠 (이미 정한 닉네임은 건드리지 않음)
  try {
    const gname = localStorage.getItem("hub.gname");
    if (gname) ["ip.name", "bw.name", "jg.name", "rps.name", "bb.name", "stock.name"].forEach(k => {
      if (!localStorage.getItem(k)) localStorage.setItem(k, gname);
    });
  } catch (e) {}

  // 구글 로그인 (온라인일 때만). 로그인하면 기록 주인이 익명 ID 대신 구글 계정이 돼요.
  let auth = null, authReady = Promise.resolve();
  try {
    if (LIVE && firebase.auth) {
      auth = firebase.auth();
      authReady = new Promise(res => {
        let un = null;
        un = auth.onAuthStateChanged(() => { if (un) un(); res(); });
      });
      auth.getRedirectResult().catch(() => {});
      auth.onAuthStateChanged(u => {
        try {
          const cur = localStorage.getItem("hub.gname");
          if (u && u.displayName) {
            if (cur !== u.displayName) {
              localStorage.setItem("hub.gname", u.displayName);
              if (!cur && window === window.top) location.reload();
            }
          } else if (!u && cur) localStorage.removeItem("hub.gname");
        } catch (e) {}
      });
    }
  } catch (e) { auth = null; }

  /* ---------- 공통 유틸 ---------- */
  // 게임 상태는 중첩 배열이 들어가므로 Firestore 에는 JSON 문자열 한 덩어리로 저장
  const enc = o => ({ _j: JSON.stringify(o) });
  const dec = d => (d && typeof d._j === "string") ? JSON.parse(d._j) : d;
  const clean = o => JSON.parse(JSON.stringify(o === undefined ? null : o)); // undefined 제거
  const isObj = v => v && typeof v === "object" && !Array.isArray(v);
  function merge(base, patch) {
    const out = isObj(base) ? Object.assign({}, base) : {};
    for (const k of Object.keys(patch)) {
      const v = patch[k];
      out[k] = isObj(v) ? merge(isObj(out[k]) ? out[k] : {}, v) : v;
    }
    return out;
  }
  const ex = s => (typeof s.exists === "function" ? s.exists() : !!s.exists);
  const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

  /* ---------- 백엔드: Firestore ---------- */
  const F = {
    async get(p) { const s = await fs.doc(p).get(); return ex(s) ? dec(s.data()) : null; },
    async set(p, o) { await fs.doc(p).set(enc(clean(o))); },
    async update(p, patch) {
      await fs.runTransaction(async tx => {
        const ref = fs.doc(p); const s = await tx.get(ref);
        if (!ex(s)) throw new Error("no such doc");
        tx.set(ref, enc(clean(merge(dec(s.data()), patch))));
      });
    },
    async del(p) { await fs.doc(p).delete(); },
    watch(p, cb, err) {
      return fs.doc(p).onSnapshot(s => cb(ex(s) ? dec(s.data()) : null), err || (() => {}));
    },
    async add(c, o) { const r = await fs.collection(c).add(clean(o)); return r.id; },
    async query(c, wheres, limit) {
      let q = fs.collection(c);
      for (const [f, op, v] of wheres) q = q.where(f, op, v);
      if (limit) q = q.limit(limit);
      const s = await q.get();
      return s.docs.map(d => ({ id: d.id, data: dec(d.data()) }));
    }
  };

  /* ---------- 백엔드: localStorage (설정 전 / 같은 기기) ---------- */
  const PFX = "hubdb:";
  const LS_LISTEN = new Map(); // path -> Set(cb)
  const lsRead = k => { try { const s = localStorage.getItem(k); return s == null ? null : JSON.parse(s); } catch (e) { return null; } };
  const lsWrite = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const notify = p => { const set = LS_LISTEN.get(p); if (set) set.forEach(cb => { try { cb(lsRead(PFX + p) == null ? null : dec(lsRead(PFX + p))); } catch (e) {} }); };
  window.addEventListener("storage", e => {
    if (!e.key || e.key.indexOf(PFX) !== 0) return;
    notify(e.key.slice(PFX.length));
  });
  const L = {
    async get(p) { const v = lsRead(PFX + p); return v == null ? null : dec(v); },
    async set(p, o) { lsWrite(PFX + p, enc(clean(o))); notify(p); },
    async update(p, patch) {
      const cur = await L.get(p);
      if (cur == null) throw new Error("no such doc");
      lsWrite(PFX + p, enc(clean(merge(cur, patch)))); notify(p);
    },
    async del(p) { try { localStorage.removeItem(PFX + p); } catch (e) {} notify(p); },
    watch(p, cb) {
      if (!LS_LISTEN.has(p)) LS_LISTEN.set(p, new Set());
      LS_LISTEN.get(p).add(cb);
      L.get(p).then(cb, () => {});
      return () => { const s = LS_LISTEN.get(p); if (s) s.delete(cb); };
    },
    async add(c, o) { const id = rid(); lsWrite(PFX + c + "/" + id, clean(o)); return id; },
    async query(c, wheres, limit) {
      const out = [];
      let keys = [];
      try { for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i)); } catch (e) {}
      for (const k of keys) {
        if (!k || k.indexOf(PFX + c + "/") !== 0) continue;
        const d = lsRead(k); if (d == null) continue;
        const ok = wheres.every(([f, op, v]) => {
          if (op === "array-contains") return Array.isArray(d[f]) && d[f].indexOf(v) >= 0;
          if (op === "==") return d[f] === v;
          return false;
        });
        if (ok) out.push({ id: k.slice((PFX + c + "/").length), data: d });
        if (limit && out.length >= limit) break;
      }
      return out;
    }
  };

  const B = LIVE ? F : L;

  /* ---------- 공개 모양: db ---------- */
  const snapOf = (id, data) => ({
    id, exists: data != null,
    data() { return data == null ? undefined : data; }
  });
  function query(c, wheres, limit) {
    return {
      where(f, op, v) { return query(c, wheres.concat([[f, op, v]]), limit); },
      limit(n) { return query(c, wheres, n); },
      async get() {
        const rows = await B.query(c, wheres, limit);
        return { docs: rows.map(r => ({ id: r.id, data() { return r.data; } })) };
      }
    };
  }
  function docRef(p) {
    return {
      async get() { return snapOf(p.split("/").pop(), await B.get(p)); },
      set(o) { return B.set(p, o); },
      update(patch) { return B.update(p, patch); },
      delete() { return B.del(p); },
      onSnapshot(next, err) {
        return B.watch(p, d => { try { next(snapOf(p.split("/").pop(), d)); } catch (e) {} }, err);
      }
    };
  }
  const db = {
    doc: docRef,
    collection(c) {
      return {
        add(o) { return B.add(c, o).then(id => ({ id })); },
        where(f, op, v) { return query(c, [[f, op, v]], null); },
        doc(id) { return docRef(c + "/" + id); }
      };
    }
  };

  /* ---------- 공개 모양: user (기기별 익명 ID) ---------- */
  let memUid = null;
  function uid() {
    if (memUid) return memUid;
    try {
      let u = localStorage.getItem("hub.uid");
      if (!u) { u = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : rid() + rid(); localStorage.setItem("hub.uid", u); }
      memUid = u;
    } catch (e) { memUid = memUid || rid() + rid(); }
    return memUid;
  }
  async function currentUid() {
    await authReady;
    if (auth && auth.currentUser) return "g-" + auth.currentUser.uid;
    return uid();
  }
  const user = {
    async id() { return currentUid(); },
    async me() { return { id: await currentUid() }; },
    async can() { return true; },
    isOwner() { return true; },
    canEdit() { return true; },
    async profiles(ids) { const o = {}; (ids || []).forEach(i => o[i] = { name: "" }); return o; }
  };

  window.claude = {
    use(name) {
      if (name === "db") return Promise.resolve(db);
      if (name === "user") return Promise.resolve(user);
      return Promise.resolve(null);
    }
  };
  window.HUB_STORAGE_MODE = LIVE ? "online" : "local";
  // 홈 화면의 로그인 버튼이 쓰는 함수. 로그인/로그아웃 뒤에는 새로고침해서 기록 주인을 바꿔요.
  window.HUB_AUTH = {
    available: !!auth,
    ready: authReady,
    user: () => (auth && auth.currentUser) || null,
    async login() {
      const p = new firebase.auth.GoogleAuthProvider();
      try { await auth.signInWithPopup(p); location.reload(); }
      catch (e) { await auth.signInWithRedirect(p); }
    },
    async logout() { await auth.signOut(); location.reload(); }
  };

  if (!LIVE) {
    document.addEventListener("DOMContentLoaded", () => {
      const n = document.createElement("div");
      n.setAttribute("role", "note");
      n.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:99;padding:8px 14px;font:13px/1.4 system-ui,sans-serif;background:#2a2412;color:#f3d98a;text-align:center";
      n.textContent = "온라인 연결 전이라 이 기기 안에서만 저장·대결돼요. (탭하면 닫혀요)";
      n.onclick = () => n.remove();
      document.body.appendChild(n);
    });
  }
})();

</script>

<style>
/* Layout: a game picker on a dark stage; each game runs in its own sealed frame below. Deliberately single dark look. */
:root{
  --stage:#11161f; --panel:#1a2230; --line:#2c384c; --ink:#ecf0f5; --muted:#93a0b4; --gold:#e2b44b;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;

  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
#home{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 24px}
#home h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.05;margin:0;text-wrap:balance}
#home .lead{color:var(--muted);margin:0}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0}
.games{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.game{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;transition:transform .1s,border-color .15s}
.game:hover{border-color:var(--muted)}
.game:active{transform:scale(.98)}
.game:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.game .art{display:flex;gap:4px;flex:none;width:104px;justify-content:center}
.game .txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.game .nm{font-family:var(--display);font-size:26px;line-height:1.1}
.game .ds{color:var(--muted);font-size:14px}
.game .tag{font-size:12px;color:var(--gold)}
.pk{width:34px;height:48px;border-radius:6px;display:grid;place-items:center;font-family:var(--display);font-size:20px}

.om-st.w{background:#f5f1e8;box-shadow:0 0 0 1px #b8ad98 inset}
.jg{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;background:#efe6d2;font-family:"Noto Serif KR",serif;font-weight:900;font-size:20px;border:2px solid #c9b896}
.jg.g{color:#2f7d52}.jg.r{color:#b8423a}.jg.r span{transform:rotate(180deg);display:block}
.rp{width:30px;height:42px;border-radius:6px;display:grid;place-items:center;font-family:var(--display);font-size:12px;color:#1b1520}
.rp.s{background:#ef6f5e}.rp.r{background:#7f9cc9}.rp.p{background:#f0c25a}
.stats{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.stats h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.sbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.sbox .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sbox .who{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sbox .tot{font-size:13px;color:var(--muted);flex:none}
.srow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:14px}
.srow .g{color:var(--muted)}
.wld{font-variant-numeric:tabular-nums;display:flex;gap:10px}

.foot{font-size:13px;color:var(--muted)}
.host{min-height:100%;display:flex;flex-direction:column}
.sk{font-family:var(--display);font-size:22px;line-height:1;color:var(--gold)}
.sk.up{color:#ff4d5e}.sk.dn{color:#4d8dff}
.btn-back{align-self:flex-start;background:transparent;border:0;color:var(--muted);padding:12px 16px;font:500 15px var(--body);cursor:pointer}
#host-stock{display:flex;flex-direction:column;min-height:100vh}

.sg-err{min-height:20px;margin-top:10px;color:#f87171;font-size:14px}
#stockFrame{flex:1;width:100%;min-height:calc(100vh - 48px);border:0;display:block}
#host-escape{display:flex;flex-direction:column;min-height:100vh}
#escFrame{flex:1;width:100%;min-height:calc(100vh - 48px);border:0;display:block}

.authrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:-4px}
@media (prefers-reduced-motion:reduce){.game{transition:none}}

onst used = Math.floor((Date.now()-startAt)/1000);\n    let title, text;\n    if (escaped){\n      title = \"\ud0c8\ucd9c \uc131\uacf5!\"; text = \"\uac78\ub9b0 \uc2dc\uac04 \" + fmt(used);\n      saveBest(room.id, used);\n      text += \"\\n\ucd5c\uace0 \uae30\ub85d \" + fmt(bestOf(room.id));\n    } else {\n      title = \"\uc2dc\uac04 \ucd08\uacfc\"; text = \"\ud0c8\ucd9c\ud558\uc9c0 \ubabb\ud588\uc5b4\uc694. \ub2e4\uc2dc \ub3c4\uc804\ud574 \ubcf4\uc138\uc694.\";\n    }\n    $(\"endTitle\").textContent = title; $(\"endText\").textContent = text; $(\"endDlg\").showModal();\n  }\n  $(\"endAgain\").onclick = () => { $(\"endDlg\").close(); startRoom(room); };\n  $(\"endList\").onclick = () => { $(\"endDlg\").close(); showRooms(); };\n  $(\"btnRooms\").onclick = () => { closeDlg(); showRooms(); };\n\n  showRooms();\n})();\n<\/script>\n<\/body>\n<\/html>\n";
function bootPoker(root,api){

const $=id=>root.getElementById(id);
const START_CHIPS = 30, LOG_MAX = 8;
const S = { db:null, uid:null, code:null, game:null, unsub:null, busy:false, raise:1, lastRevealKey:"", local:false, botTimer:null, reveal:{key:"",step:0,timer:null} };

function lsGet(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }
function lsSet(k,v){ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v) }catch(e){} }
function show(id){ for(const s of ["lobby","waiting","table","nodb"]) $(s).hidden = s!==id }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600) }
const clone = o => JSON.parse(JSON.stringify(o));

function freshDeck(){
  const d=[]; for(let v=1; v<=10; v++){ d.push(v,v) }
  for(let i=d.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [d[i],d[j]]=[d[j],d[i]] }
  return d;
}
function addLog(g,msg){ g.log=[msg,...(g.log||[])].slice(0,LOG_MAX) }
const nm = (g,i) => g.names[i] || (i===0?"방장":"도전자");

/* ---------- 게임 규칙 ---------- */
function startRound(g){
  if(g.deck.length<2){ g.deck=freshDeck(); g.used=[]; addLog(g,"카드 20장을 새로 섞었어요") }
  g.cards=[g.deck.pop(), g.deck.pop()];
  g.chips[0]-=1; g.chips[1]-=1; g.bets=[1,1];
  g.acted=[false,false]; g.turn=g.starter; g.round+=1; g.lastRaise=[0,0]; g.botRaises=0;
  g.status="playing"; g.result=null;
  addLog(g, `${g.round}판 시작 · ${nm(g,g.turn)} 먼저`);
}
function endRound(g, winner, reason, penalty){
  const pot=g.bets[0]+g.bets[1];
  let amount=0;
  // 올인 상태에서 비기면 이월할 수 없으니, 승부가 날 때까지 카드를 새로 까요
  const ties=[];
  while(winner<0 && (g.chips[0]===0 || g.chips[1]===0)){
    ties.push([...g.cards]);
    g.used=[...(g.used||[]), ...g.cards];
    if(g.deck.length<2){ g.deck=freshDeck(); g.used=[]; addLog(g,"카드 20장을 새로 섞었어요") }
    g.cards=[g.deck.pop(), g.deck.pop()];
    winner = g.cards[0]===g.cards[1] ? -1 : (g.cards[0]>g.cards[1] ? 0 : 1);
  }
  if(ties.length) addLog(g, `올인 동점 → 카드를 다시 깠어요 (${g.cards[0]} 대 ${g.cards[1]})`);
  if(winner<0){ g.carry+=pot }
  else { amount=pot+g.carry; g.chips[winner]+=amount; g.carry=0; g.starter=1-winner }
  g.used=[...(g.used||[]), ...g.cards];
  g.result={ winner, reason, cards:[...g.cards], amount, penalty:penalty||0, pot, ties };
  g.status="roundEnd";
  if(winner<0) addLog(g, `${g.cards[0]} 대 ${g.cards[1]} 무승부 · 판돈 ${pot} 이월`);
  else addLog(g, `${nm(g,winner)} 승리 +${amount}` + (reason==="fold"?" (다이)":` (${g.cards[0]} 대 ${g.cards[1]})`) + (penalty?` · 10 다이 벌금 ${penalty}`:""));
  if(g.chips[0]<=0 || g.chips[1]<=0){
    const w = g.chips[0]<=0 ? 1 : 0;
    g.chips[w]+=g.carry; g.carry=0;
    g.status="over"; g.winner=w;
    addLog(g, `${nm(g,w)}의 최종 승리!`);
  }
}
function newGameState(code,uid,name){
  return { code, players:[uid,null], names:[name,""], status:"waiting",
    chips:[START_CHIPS,START_CHIPS], deck:freshDeck(), used:[], cards:[0,0], bets:[0,0],
    acted:[false,false], turn:0, starter:0, round:0, carry:0, result:null, winner:null,
    log:[], updatedAt:Date.now() };
}

/* ---------- 저장 ---------- */
async function save(g){
  if(g.status==="over"&&!(S.game&&S.game.status==="over"))reportResult(g);
  if(S.local){ S.game=g; render(); return }
  S.busy=true; renderActions();
  g.updatedAt=Date.now();
  try{ await S.db.doc("games/"+g.code).set(g) }
  catch(e){ toast(e&&e.code==="invalid_argument" ? "이 페이지에 쓸 권한이 없어요. 공유 설정을 확인해 주세요." : "저장에 실패했어요. 다시 눌러 주세요.") }
  finally{ S.busy=false; renderActions() }
}

/* ---------- 행동 ---------- */
function meIdx(){ if(S.local) return 0; return S.game ? S.game.players.indexOf(S.uid) : -1 }
function maxRaise(g,i){ const j=1-i; const toCall=g.bets[j]-g.bets[i]; return Math.max(0, Math.min(g.chips[i]-toCall, g.chips[j])) }

async function act(kind, i=meIdx(), amt=S.raise){
  const g0=S.game;
  if(S.busy || !g0 || g0.status!=="playing" || g0.turn!==i) return;
  const g=clone(g0), j=1-i, toCall=g.bets[j]-g.bets[i];
  if(kind==="fold"){
    let pen=0;
    if(g.cards[i]===10){ pen=Math.min(10,g.chips[i]); g.chips[i]-=pen; g.chips[j]+=pen }
    addLog(g, `${nm(g,i)} 다이`);
    endRound(g, j, "fold", pen);
  } else if(kind==="call"){
    g.chips[i]-=toCall; g.bets[i]+=toCall;
    const showdown = toCall>0 || g.acted[j];
    g.acted[i]=true;
    addLog(g, toCall>0 ? `${nm(g,i)} 콜` : `${nm(g,i)} 체크`);
    if(showdown){ const a=g.cards[0], b=g.cards[1]; endRound(g, a===b?-1:(a>b?0:1), "show") }
    else g.turn=j;
  } else if(kind==="raise"){
    const r=Math.max(1, Math.min(amt, maxRaise(g,i)));
    if(maxRaise(g,i)<1) return;
    g.chips[i]-=toCall+r; g.bets[i]=g.bets[j]+r; g.acted[i]=true; g.turn=j;
    if(g.lastRaise) g.lastRaise[i]=r;
    if(S.local && i===1) g.botRaises=(g.botRaises||0)+1;
    addLog(g, `${nm(g,i)} ${r} 레이즈`);
  }
  S.raise=1;
  await save(g);
}
async function nextRound(){
  const g0=S.game; if(S.busy||!g0||g0.status!=="roundEnd") return;
  const g=clone(g0); startRound(g); await save(g);
}
async function rematch(){
  const g0=S.game; if(S.busy||!g0||g0.status!=="over") return;
  const g=clone(g0);
  g.chips=[START_CHIPS,START_CHIPS]; g.deck=freshDeck(); g.used=[]; g.carry=0; g.round=0;
  g.starter = 1-g.winner; g.winner=null; g.log=[]; addLog(g,"새 게임을 시작했어요");
  startRound(g); await save(g);
}

/* ---------- COM ---------- */
// COM은 플레이어 카드(이마)와 지나간 카드만 보고, 자기 카드는 모른 채 확률로 판단해요.
function botMove(){
  S.botTimer=null;
  const g=S.game; if(!S.local||!g||g.status!=="playing"||g.turn!==1) return;
  const seen=g.cards[0];
  const pool={}; for(let v=1;v<=10;v++) pool[v]=2;
  (g.used||[]).forEach(v=>pool[v]--); pool[seen]--;
  let total=0, winP=0;
  for(let v=1;v<=10;v++){ const n=Math.max(0,pool[v]); total+=n; winP += n*(v>seen?1:v===seen?0.5:0) }
  let p = total ? winP/total : 0.5;
  const q10 = total ? Math.max(0,pool[10])/total : 0;
  // 상대가 크게 올렸다면 내 카드가 낮아 보인다는 신호로 읽어요 (가끔은 블러핑이라 믿지 않음)
  const hr=(g.lastRaise&&g.lastRaise[0])||0;
  if(hr>0 && Math.random()<0.75) p = Math.max(0, p - Math.min(0.2, 0.03*hr));
  p += (Math.random()-0.5)*0.08;

  const toCall=g.bets[0]-g.bets[1];
  const pot=g.bets[0]+g.bets[1]+g.carry;
  const mr=maxRaise(g,1);
  const canRaise = mr>=1 && (g.botRaises||0)<2;
  const bluff = Math.random()<0.1;
  const sizeFor = pp => Math.max(1, Math.min(mr, Math.round(1 + Math.max(0,pp-0.55)*18 + Math.random()*2)));

  if(toCall===0){
    if(canRaise && (p>0.62 || bluff)) return act("raise",1, bluff&&p<=0.62 ? 1+Math.floor(Math.random()*3) : sizeFor(p));
    return act("call",1);
  }
  const callEV = p*(pot+toCall) - toCall;
  const foldEV = -10*q10;
  if(canRaise && p>0.75 && Math.random()<0.6) return act("raise",1,sizeFor(p));
  if(callEV >= foldEV || (bluff && toCall<=3)) return act("call",1);
  return act("fold",1);
}
function scheduleBot(){
  const g=S.game;
  if(!S.local||!g||g.status!=="playing"||g.turn!==1||S.botTimer) return;
  S.botTimer=setTimeout(botMove, 900+Math.random()*900);
}

function cardFace(el,v,animate){
  el.className="card face"+(v===10?" ten":"")+(animate?" flip":"");

  const tl=document.createElement("span"); tl.className="c tl"; tl.textContent=v;

}
function cardBack(el){ el.className="card back"; el.innerHTML='<span class="v">?</span>' }

function render(){
  const g=S.game; if(!g) return;
  const i=meIdx();
  if(g.status==="waiting"){
    if(i!==0){ leave("방에 들어갈 수 없어요."); return }
    show("waiting"); $("waitCode").textContent=g.code; return;
  }
  if(i<0){ leave("이미 두 명이 게임 중인 방이에요."); return }
  show("table");
  const j=1-i;
  $("tCode").textContent=S.local?"COM 대결":"방 "+g.code;$("tRound").textContent=g.round; $("tDeck").textContent=g.deck.length;
  $("oppName").textContent=nm(g,j); $("myName").textContent=nm(g,i)==="나"?"나":nm(g,i)+" (나)";
  $("oppChips").textContent=g.chips[j]; $("myChips").textContent=g.chips[i];
  $("oppBet").textContent=g.bets[j]; $("myBet").textContent=g.bets[i];
  $("pot").textContent=g.bets[0]+g.bets[1]+g.carry;
  $("carry").hidden=!g.carry; $("carry").textContent=`이월된 칩 ${g.carry}개 포함`;
  $("oppSeat").classList.toggle("active", g.status==="playing" && g.turn===j);
  $("meSeat").classList.toggle("active", g.status==="playing" && g.turn===i);

  // 카드 (올인 동점이면 동점 카드 → 다시 깐 카드 순서로 보여줘요)
  const revealed = g.status==="roundEnd" || g.status==="over";
  const key = g.code+":"+g.round;
  const seq = revealed && g.result ? [...(g.result.ties||[]), g.result.cards] : [g.cards];
  if(revealed && seq.length>1 && S.reveal.key!==key){
    clearTimeout(S.reveal.timer);
    S.reveal={ key, step:0, timer:null };
    const tick=()=>{ S.reveal.timer=setTimeout(()=>{ S.reveal.step++; render(); if(S.reveal.step<seq.length-1) tick() }, 2200) };
    tick();
  }
  const step = (revealed && S.reveal.key===key) ? Math.min(S.reveal.step, seq.length-1) : seq.length-1;
  const pair = seq[step];
  const finalStep = step===seq.length-1;
  const flipKey = key+":"+step;
  if(revealed){
    const anim = S.lastRevealKey!==flipKey;
    cardFace($("oppCard"), pair[j], anim && step>0);
    cardFace($("myCard"), pair[i], anim);
    S.lastRevealKey=flipKey;
  } else { cardFace($("oppCard"), g.cards[j], false); cardBack($("myCard")) }

  // 상태 줄
  const st=$("statusLine");
  if(revealed && !finalStep){
    st.className="status mine";
    st.textContent=`${pair[i]} 대 ${pair[j]} 동점! 올인이라 카드를 다시 깝니다`;
  } else if(g.status==="playing"){
    const mine=g.turn===i; st.className="status"+(mine?" mine":"");
    st.textContent = mine ? "내 차례예요" : (S.local ? "COM이 고민 중" : `${nm(g,j)}의 차례예요`);
    if(!mine && S.local) st.insertAdjacentHTML("beforeend",'<span class="thinking" aria-hidden="true"><i></i><i></i><i></i></span>');
  } else st.textContent="";

  // 결과
  const rb=$("resultBox");
  if(revealed && g.result && finalStep){
    rb.hidden=false;
    const r=g.result, big=$("resultBig");
    if(g.status==="over"){
      big.className="big "+(g.winner===i?"win":"lose");
      big.textContent = g.winner===i ? "최종 승리!" : "최종 패배";
    } else if(r.winner<0){ big.className="big tie"; big.textContent="무승부" }
    else { big.className="big "+(r.winner===i?"win":"lose"); big.textContent = r.winner===i?`+${r.amount} 승리`:"패배" }
    let t = "";
    if(r.ties && r.ties.length) t += r.ties.map(p=>`${p[i]} 대 ${p[j]} 동점`).join(" → ") + " → 다시 까서 ";
    t += `내 카드 ${r.cards[i]} · 상대 카드 ${r.cards[j]}`;
    if(r.reason==="fold") t += r.winner===i ? " · 상대가 다이했어요" : " · 내가 다이했어요";
    if(r.penalty) t += ` · 10 다이 벌금 ${r.penalty}칩`;
    if(r.winner<0) t += ` · 판돈 ${r.pot}칩이 다음 판으로`;
    $("resultText").textContent=t;
    $("btnNext").textContent = g.status==="over" ? "다시 하기" : "다음 판";
  } else rb.hidden=true;

  renderActions();

  // 트래커
  const used={}; (g.used||[]).forEach(v=>used[v]=(used[v]||0)+1);
  const tr=$("tracker"); tr.innerHTML="";
  for(let v=1;v<=10;v++){
    const u=used[v]||0;
    const d=document.createElement("div");
    d.className="tk"+(u>=2?" gone":"")+(g.status==="playing"&&g.cards[j]===v?" seen":"");
    d.innerHTML=`<span class="v">${v}</span><span class="dots"><span class="dot${u>=1?" used":""}"></span><span class="dot${u>=2?" used":""}"></span></span>`;
    d.setAttribute("aria-label",`${v}: ${2-u}장 남음`);
    tr.append(d);
  }
  // 로그
  const lg=$("log"); lg.innerHTML="";
  (g.log||[]).forEach(m=>{ const li=document.createElement("li"); li.textContent=m; lg.append(li) });
  scheduleBot();
}

function bootBW(root,api){

const $=id=>root.getElementById(id);
const S={db:null,uid:null,code:null,game:null,unsub:null,busy:false,sel:null,local:false,botTimer:null,lastHist:-1};
const ROUNDS=9;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function show(id){for(const s of["lobby","waiting","table"])$(s).hidden=s!==id}
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
const clone=o=>JSON.parse(JSON.stringify(o));
const isBlack=v=>v%2===0;
const colorName=v=>isBlack(v)?"흑":"백";
const nm=(g,i)=>g.names[i]||(i===0?"방장":"도전자");

/* ---------- 규칙 ---------- */
function newGame(code,uid,name){
  return {code,players:[uid,null],names:[name,""],status:"waiting",
    hands:[[0,1,2,3,4,5,6,7,8],[0,1,2,3,4,5,6,7,8]],played:[null,null],
    leader:0,firstLeader:0,round:1,score:[0,0],history:[],winner:null,updatedAt:Date.now()};
}
function resetPlay(g,leader){
  g.hands=[[0,1,2,3,4,5,6,7,8],[0,1,2,3,4,5,6,7,8]]; g.played=[null,null];
  g.leader=leader; g.firstLeader=leader; g.round=1; g.score=[0,0]; g.history=[]; g.winner=null; g.status="playing";
}
// 타일 내기: 선이 먼저, 그다음 후공. 후공이 내면 라운드 판정
function playTile(g,i,v){
  if(g.status!=="playing"||!g.hands[i].includes(v)||g.played[i]!==null) return false;
  const follower=1-g.leader;
  if(i===follower && g.played[g.leader]===null) return false;
  g.played[i]=v; g.hands[i]=g.hands[i].filter(x=>x!==v);
  if(g.played[0]!==null && g.played[1]!==null){
    const [a,b]=g.played; const w=a===b?-1:(a>b?0:1);
    g.history.push({round:g.round,leader:g.leader,tiles:[a,b],winner:w});
    if(w>=0){ g.score[w]++; g.leader=w }
    g.played=[null,null]; g.round++;
    const left=ROUNDS-g.history.length;
    if(left===0 || g.score[0]>g.score[1]+left || g.score[1]>g.score[0]+left){
      g.status="over"; g.winner = g.score[0]===g.score[1]?-1:(g.score[0]>g.score[1]?0:1);
    }
  }
  return true;
}

/* ---------- 저장 ---------- */
async function save(g){
  if(g.status==="over"&&!(S.game&&S.game.status==="over"))reportResult(g);
  if(S.local){S.game=g;render();return}
  S.busy=true;renderHand();g.updatedAt=Date.now();
  try{await S.db.doc("bw_games/"+g.code).set(g)}
  catch(e){toast(e&&e.code==="invalid_argument"?"이 페이지에 쓸 권한이 없어요. 공유 설정을 확인해 주세요.":"저장에 실패했어요. 다시 눌러 주세요.")}
  finally{S.busy=false;renderHand()}
}
function meIdx(){if(S.local)return 0;return S.game?S.game.players.indexOf(S.uid):-1}
function myTurn(g,i){ if(g.status!=="playing") return false; return g.played[g.leader]===null ? g.leader===i : (1-g.leader)===i }

async function playSelected(){
  const g0=S.game,i=meIdx(); if(S.busy||!g0||S.sel===null||!myTurn(g0,i)) return;
  const g=clone(g0); if(!playTile(g,i,S.sel)) return;
  S.sel=null; await save(g);
}

/* ---------- COM ---------- */
// COM은 자기 타일, 상대가 낸 색, 라운드 승패만 보고 상대 타일을 추론해요.
function inferCurrent(g,me){
  const opp=1-me;
  const cons=g.history.map(h=>{const b=h.tiles[me],t=h.tiles[opp];return {black:isBlack(t),rel:h.winner===opp?1:h.winner===me?-1:0,b}});
  const cur=g.played[opp]; const curBlack = cur===null?null:isBlack(cur);
  const weight=new Array(9).fill(0); let total=0; const used=new Array(9).fill(false);
  function ok(t,c){ if(isBlack(t)!==c.black) return false; return c.rel===1?t>c.b:c.rel===-1?t<c.b:t===c.b }
  (function bt(k){
    if(k===cons.length){
      for(let t=0;t<9;t++){ if(used[t]) continue; if(curBlack!==null && isBlack(t)!==curBlack) continue; weight[t]++; total++ }
      return;
    }
    for(let t=0;t<9;t++){ if(used[t]||!ok(t,cons[k])) continue; used[t]=true; bt(k+1); used[t]=false }
  })(0);
  return {weight,total};
}
function botChoose(g){
  const me=1, hand=g.hands[me], opp=0;
  const left=ROUNDS-g.history.length;
  const need=g.score[opp]-g.score[me];
  const lam=0.06*Math.max(0,left-1)/8;
  if(g.played[opp]!==null){
    const {weight,total}=inferCurrent(g,me);
    let best=null,bestS=-1e9;
    for(const x of hand){
      let w=0,d=0; for(let t=0;t<9;t++){ if(t<x) w+=weight[t]; else if(t===x) d+=weight[t] }
      const pw=total?w/total:0.5, pd=total?d/total:0;
      const s=pw+0.4*pd-lam*x+(Math.random()-0.5)*0.06;
      if(s>bestS){bestS=s;best=x}
    }
    return best;
  }
  // 선일 때: 상대 남은 타일을 추론해서, 이길 확률 대비 아까운 타일인지 따져요. 가끔은 일부러 버려요.
  const {weight,total}=inferCurrent(g,me);
  const sorted=[...hand].sort((a,b)=>a-b);
  if(Math.random()<0.15) return sorted[Math.floor(Math.random()*Math.min(2,sorted.length))];
  const urgency = need>0 ? 0.5 : 1;
  let best=sorted[0],bestS=-1e9;
  for(const x of hand){
    let w=0,d=0; for(let t=0;t<9;t++){ if(t<x) w+=weight[t]; else if(t===x) d+=weight[t] }
    const pw=total?w/total:0.5, pd=total?d/total:0;
    const s=pw+0.4*pd-lam*urgency*x*1.4+(Math.random()-0.5)*0.12;
    if(s>bestS){bestS=s;best=x}
  }
  return best;
}
function scheduleBot(){
  const g=S.game; if(!S.local||!g||!myTurn(g,1)||S.botTimer) return;
  S.botTimer=setTimeout(()=>{
    S.botTimer=null; const g0=S.game; if(!S.local||!g0||!myTurn(g0,1)) return;
    const g=clone(g0); if(playTile(g,1,botChoose(g0))) save(g);
  },900+Math.random()*900);
}
function startCom(){
  if(S.unsub){S.unsub();S.unsub=null}
  S.local=true; S.code=null; S.lastHist=-1; S.sel=null;
  const name=myName()||"나"; if(myName()) lsSet("bw.name",name);
  const g=newGame("COM","me",name); g.players=["me","com"]; g.names=[name,"COM"];
  resetPlay(g, Math.random()<0.5?0:1);

function tileEl(v,cls,showNum){
  const d=document.createElement("div");
  d.className="tile "+(isBlack(v)?"k":"w")+(cls?" "+cls:"");
  d.textContent=showNum?v:"";
  d.setAttribute("aria-label",showNum?`${colorName(v)} ${v}`:colorName(v));
  return d;
}
function setSlot(el,v,showNum,cls){
  el.className="tile lg "+(v===null?"slot":(isBlack(v)?"k":"w"))+(cls?" "+cls:"");
  el.textContent=(v!==null&&showNum)?v:"";
}
function render(){
  const g=S.game;if(!g)return;const i=meIdx();
  if(g.status==="waiting"){ if(i!==0){leave("방에 들어갈 수 없어요.");return} show("waiting");$("waitCode").textContent=g.code;return }
  if(i<0){leave("이미 두 명이 게임 중인 방이에요.");return}
  show("table");const j=1-i;const over=g.status==="over";
  $("tCode").textContent=S.local?"COM 대결":"방 "+g.code;

  $("myNm").textContent=nm(g,i)==="나"?"나":nm(g,i)+" (나)";$("oppNm").textContent=nm(g,j);
  $("myPt").textContent=g.score[i];$("oppPt").textContent=g.score[j];

  // 상대 남은 타일: 색만
  const oppHand=g.hands[j]; const ot=$("oppTiles"); ot.innerHTML="";
  [...oppHand].sort((a,b)=>(isBlack(b)-isBlack(a))||a-b).forEach(v=>ot.append(tileEl(v,"sm",over)));
  const kb=oppHand.filter(isBlack).length; $("oppLeft").textContent=`흑 ${kb} · 백 ${oppHand.length-kb}`;

  // 직전 라운드 결과
  const last=g.history[g.history.length-1];
  const bn=$("banner");
  const fresh = g.history.length!==S.lastHist;
  const showLast = last && g.played[0]===null && g.played[1]===null;
  if(showLast){
    bn.hidden=false;
    const r=last.winner<0?"draw":last.winner===i?"win":"lose";
    bn.className="banner "+r;
    bn.textContent=`${last.round}라운드 ${r==="win"?"승리":r==="lose"?"패배":"무승부"}`;
    setSlot($("mySlot"),last.tiles[i],true,fresh?"pop":"");
    setSlot($("oppSlot"),last.tiles[j],over,fresh?"pop":"");
  } else {
    bn.hidden=true;
    setSlot($("mySlot"),g.played[i],true,"");
    setSlot($("oppSlot"),g.played[j],false,g.played[j]!==null?"pop":"");
  }
  S.lastHist=g.history.length;

  // 상태
  const st=$("status");
  if(over){ st.textContent=""; }
  else if(myTurn(g,i)){
    st.textContent = g.played[j]!==null ? `상대가 ${colorName(g.played[j])}을 냈어요. 내 타일을 고르세요` : "내가 선이에요. 타일을 고르세요";
  } else {
    st.textContent = g.played[i]!==null ? (S.local?"COM이 고민 중":`${nm(g,j)}의 선택을 기다려요`) : (S.local?"COM이 먼저 고르는 중":`${nm(g,j)}이 먼저 고르는 중`);
    if(S.local) st.insertAdjacentHTML("beforeend",'<span class="thinking" aria-hidden="true"><i></i><i></i><i></i></span>');
  }

  // 최종
  const fb=$("finalBox"); fb.hidden=!over; $("handWrap").hidden=over;
  if(over){
    const big=$("finalBig");
    big.textContent=g.winner<0?"무승부":g.winner===i?"승리!":"패배";
    big.style.color=g.winner<0?"var(--draw)":g.winner===i?"var(--win)":"var(--lose)";
    $("finalText").textContent=`${g.score[i]} : ${g.score[j]} · 기록에서 상대가 낸 숫자를 확인해 보세요`;
  }

  renderHand(); renderHistory(g,i,j,over); scheduleBot();
}
function renderHand(){
  const g=S.game;if(!g)return;const i=meIdx();
  const can=myTurn(g,i)&&!S.busy;
  if(S.sel!==null && !g.hands[i].includes(S.sel)) S.sel=null;
  const h=$("hand"); h.innerHTML=""; h.classList.toggle("locked",!can);
  for(let v=0;v<9;v++){
    const b=document.createElement("button");
    const has=g.hands[i].includes(v);
    b.className="tile "+(isBlack(v)?"k":"w")+(has?"":" used")+(S.sel===v?" sel":"");
    b.textContent=v; b.id="t"+v; b.disabled=!has||!can;
    b.setAttribute("aria-label",`${colorName(v)} ${v}`); b.setAttribute("aria-pressed",S.sel===v);
    b.onclick=()=>{S.sel=S.sel===v?null:v;renderHand()};

  }
  const pb=$("btnPlay");

  pb.textContent=!can?"상대 차례예요":S.sel===null?"타일을 고르세요":`${colorName(S.sel)} ${S.sel} 내기`;
}
function renderHistory(g,i,j,over){
  const tb=$("histBody"); tb.innerHTML="";
  $("histEmpty").hidden=g.history.length>0;
  [...g.history].reverse().forEach(h=>{
    const tr=document.createElement("tr");
    const td=t=>{const c=document.createElement("td");if(t!=null)c.append(t);tr.append(c);return c};
    td(document.createTextNode(h.round));
    td(document.createTextNode(h.leader===i?"나":"상대"));
    td(tileEl(h.tiles[i],"sm",true));
    td(tileEl(h.tiles[j],"sm",over));
    const r=h.winner<0?"draw":h.winner===i?"win":"lose";
    const c=td(document.createTextNode(r==="win"?"승":r==="lose"?"패":"무")); c.className="res-"+r;
    tb.append(tr);
  });
}

function bootBB(root,api){

const $=id=>root.getElementById(id);
const S={db:null,uid:null,code:null,game:null,unsub:null,busy:false,local:false,botTimer:null,
  input:[],mySecret:null,comSecret:null,memo:{},answering:"",revealing:false,level:"norm",secretLoaded:false};
const MAX_GUESS=30;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function show(id){for(const s of["lobby","waiting","table"])$(s).hidden=s!==id}
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
const clone=o=>JSON.parse(JSON.stringify(o));
const nm=(g,i)=>g.names[i]||(i===0?"방장":"도전자");

/* ---------- 규칙 ---------- */
function score(secret,guess){let s=0,b=0;for(let k=0;k<3;k++){if(guess[k]===secret[k])s++;else if(secret.includes(guess[k]))b++}return{s,b}}
const valid=x=>/^\d{3}$/.test(x)&&new Set(x).size===3;
function randomSecret(){const d=[..."0123456789"];for(let i=9;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}return d.slice(0,3).join("")}
const ALL=(()=>{const a=[];for(let n=0;n<1000;n++){const x=String(n).padStart(3,"0");if(valid(x))a.push(x)}return a})();
function newGame(code,uid,name){return{code,players:[uid,null],names:[name,""],status:"waiting",ready:{0:false,1:false},
  starter:0,turn:0,pending:null,history:[],finalChance:false,firstHit:null,winner:null,reveal:{},round:0,updatedAt:Date.now()}}
function resetPlay(g,starter){Object.assign(g,{status:"playing",ready:{0:false,1:false},starter,turn:starter,pending:null,history:[],finalChance:false,firstHit:null,winner:null,reveal:{},round:(g.round||0)+1})}
const bothReady=g=>g.ready&&g.ready[0]&&g.ready[1];
// 상대(holder)가 자기 비밀 숫자로 대기 중인 추측에 답해요
function answer(g,holder,secret){
  const p=g.pending;if(!p||p.by===holder)return false;
  const r=score(secret,p.guess);g.history.push({by:p.by,guess:p.guess,s:r.s,b:r.b});g.pending=null;
  const byCount=g.history.filter(h=>h.by===p.by).length;
  if(r.s===3){
    if(g.finalChance){g.status="over";g.winner=-1}
    else if(p.by===g.starter){g.finalChance=true;g.firstHit=p.by;g.turn=holder}
    else{g.status="over";g.winner=p.by}
  }else if(g.finalChance){g.status="over";g.winner=g.firstHit}
  else if(byCount>=MAX_GUESS&&p.by!==g.starter){g.status="over";g.winner=-1}
  else g.turn=holder;
  return true}

/* ---------- 저장 ---------- */
async function save(g){
  if(g.status==="over"&&!(S.game&&S.game.status==="over"))reportResult(g);
  if(S.local){S.game=g;render();return}
  S.busy=true;renderInput();g.updatedAt=Date.now();
  try{await S.db.doc("bb_games/"+g.code).set(g)}
  catch(e){toast(e&&e.code==="invalid_argument"?"이 페이지에 쓸 권한이 없어요. 공유 설정을 확인해 주세요.":"저장에 실패했어요. 다시 눌러 주세요.")}
  finally{S.busy=false;renderInput()}
}
function meIdx(){if(S.local)return 0;return S.game?S.game.players.indexOf(S.uid):-1}
const secretRef=code=>S.db.doc("data/users/"+S.uid+"/bb-"+code);

async function submit(){
  const g0=S.game,i=meIdx(),x=S.input.join("");if(S.busy||!g0||!valid(x))return;
  // 비밀 숫자 정하기
  if(g0.status==="playing"&&!g0.ready[i]){
    S.mySecret=x;S.input=[];
    if(S.local){const g=clone(g0);g.ready={0:true,1:true};S.comSecret=randomSecret();save(g);return}
    S.busy=true;renderInput();
    try{await secretRef(g0.code).set({secret:x,round:g0.round||1});await S.db.doc("bb_games/"+g0.code).update({ready:{[i]:true},updatedAt:Date.now()})}
    catch(e){S.mySecret=null;toast(e&&e.code==="invalid_argument"?"비밀 숫자를 저장할 수 없어요. 로그인과 편집 권한을 확인해 주세요.":"저장에 실패했어요. 다시 눌러 주세요.")}
    finally{S.busy=false;render()}return}
  // 추측
  if(g0.status!=="playing"||!bothReady(g0)||g0.turn!==i||g0.pending)return;
  const g=clone(g0);g.pending={by:i,guess:x};S.input=[];
  if(S.local)answer(g,1,S.comSecret);
  await save(g)}

// 온라인: 내 숫자에 대한 상대 추측이 올라오면 내 폰이 답해요
async function autoAnswer(){
  const g0=S.game,i=meIdx();if(S.local||!g0||g0.status!=="playing"||!g0.pending||g0.pending.by===i||!S.mySecret||S.busy)return;
  const key=g0.code+":"+g0.history.length+":"+g0.pending.guess;if(S.answering===key)return;S.answering=key;
  const g=clone(g0);if(answer(g,i,S.mySecret))await save(g)}
async function autoReveal(){
  const g0=S.game,i=meIdx();if(S.local||!g0||g0.status!=="over"||!S.mySecret||(g0.reveal&&g0.reveal[i])||S.revealing)return;
  S.revealing=true;try{await S.db.doc("bb_games/"+g0.code).update({reveal:{[i]:S.mySecret}})}catch(e){}finally{S.revealing=false}}
async function loadSecret(){
  const g=S.game;if(S.local||!g||S.secretLoaded)return;S.secretLoaded=true;
  try{const s=await secretRef(g.code).get();if(s.exists){const d=s.data();if(d.round===(g.round||1))S.mySecret=d.secret}}catch(e){}
  render()}

/* ---------- COM ---------- */
function comGuess(g){
  const mine=g.history.filter(h=>h.by===1);const tried=new Set(mine.map(h=>h.guess));
  const cands=ALL.filter(x=>mine.every(h=>{const r=score(x,h.guess);return r.s===h.s&&r.b===h.b}));
  if(S.level==="easy"&&Math.random()<0.6&&mine.length<7){const pool=ALL.filter(x=>!tried.has(x));return pool[Math.floor(Math.random()*pool.length)]}
  return cands[Math.floor(Math.random()*cands.length)]||ALL.find(x=>!tried.has(x))}
function scheduleBot(){
  const g=S.game;if(!S.local||!g||g.status!=="playing"||!bothReady(g)||g.turn!==1||S.botTimer)return;
  S.botTimer=setTimeout(()=>{S.botTimer=null;const g0=S.game;if(!S.local||!g0||g0.status!=="playing"||g0.turn!==1)return;
    const g=clone(g0);g.pending={by:1,guess:comGuess(g0)};answer(g,0,S.mySecret);save(g)},900+Math.random()*900)}
function startCom(){
  if(S.unsub){S.unsub();S.unsub=null}S.local=true;S.code=null;S.input=[];S.mySecret=null;S.comSecret=null;S.memo={};
  const name=myName()||"나";if(myName())lsSet("bb.name",name);
  const g=newGame("COM","me",name);g.players=["me","com"];g.names=[name,"COM"];resetPlay(g,Math.random()<0.5?0:1);save(g)}

/* ---------- 방 ---------- */
function myName(){return($("nick").value.trim()||"").slice(0,12)}
const permMsg="이 페이지에 쓸 권한이 없어요. 공유 받을 때 편집 권한이 필요해요.";
async function createRoom(){
  const name=myName();if(!name){$("lobbyErr").textContent="닉네임을 먼저 적어 주세요.";return}

  try{for(let t=0;t<8;t++){const code=String(1000+Math.floor(Math.random()*9000));const ref=S.db.doc("bb_games/"+code);const snap=await ref.get();const d=snap.exists?snap.data():null;
      if(d&&d.status!=="over"&&Date.now()-(d.updatedAt||0)<6*3600e3)continue;await ref.set(newGame(code,S.uid,name));enter(code);return}
    $("lobbyErr").textContent="빈 방 코드를 찾지 못했어요. 한 번 더 눌러 주세요."}
  catch(e){$("lobbyErr").textContent=e&&e.code==="invalid_argument"?permMsg:"방을 만들지 못했어요. 다시 시도해 주세요."}
  finally{$("btnCreate").disabled=false}}
async function joinRoom(){
  const name=myName(),code=$("joinCode").value.trim();
  if(!name){$("lobbyErr").textContent="닉네임을 먼저 적어 주세요.";return}
  if(!/^\d{4}$/.test(code)){$("lobbyErr").textContent="방 코드는 숫자 4자리예요.";return}
  lsSet("bb.name",name);$("lobbyErr").textContent="";$("btnJoin").disabled=true;
  try{const ref=S.db.doc("bb_games/"+code);const snap=await ref.get();
    if(!snap.exists){$("lobbyErr").textContent="그 코드로 열린 방이 없어요.";return}
    const g=clone(snap.data());if(g.players.includes(S.uid)){enter(code);return}

    g.players[1]=S.uid;g.names[1]=name;resetPlay(g,Math.random()<0.5?0:1);g.updatedAt=Date.now();await ref.set(g);enter(code)}
  catch(e){$("lobbyErr").textContent=e&&e.code==="invalid_argument"?permMsg:"입장하지 못했어요. 다시 시도해 주세요."}
  finally{$("btnJoin").disabled=false}}
function enter(code){
  if(S.unsub){S.unsub();S.unsub=null}

function lightsEl(kind,n){const w=document.createElement("span");w.className="lights "+kind;for(let k=0;k<3;k++){const i=document.createElement("i");if(k<n)i.className="on";w.append(i)}return w}

    else{st.textContent=S.local?"COM이 생각 중":(g.finalChance?`${nm(g,j)}의 마지막 기회`:`${nm(g,j)}의 차례예요`);st.insertAdjacentHTML("beforeend",'<span class="thinking" aria-hidden="true"><i></i><i></i><i></i></span>')}
  }
  const fb=$("finalBox");fb.hidden=!over;

    big.style.color=g.winner<0?"var(--bulb)":g.winner===i?"var(--ball)":"var(--out)";

  renderInput();renderMemo();scheduleBot()}
function renderInput(){

function bootOM(root,api){

const $=id=>root.getElementById(id);
const S={db:null,uid:null,code:null,game:null,unsub:null,busy:false,local:false,botTimer:null};
const N=15, CELLS=N*N;
const DIRS=[[1,0],[0,1],[1,1],[1,-1]];
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function show(id){for(const s of["lobby","waiting","table"])$(s).hidden=s!==id}
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2400)}
const clone=o=>JSON.parse(JSON.stringify(o));
const nm=(g,i)=>g.names[i]||(i===0?"방장":"도전자");
function myName(){return($("nick").value.trim()||"").slice(0,12)}
const permMsg="이 페이지에 쓸 권한이 없어요. 공유 받을 때 편집 권한이 필요해요.";

/* ---------- 규칙 ---------- */
function newGame(code,uid,name){return{code,players:[uid,null],names:[name,""],status:"waiting",
  board:Array(CELLS).fill(0),turn:0,winner:null,line:null,last:null,moves:0,updatedAt:Date.now()}}
function startPlay(g){Object.assign(g,{board:Array(CELLS).fill(0),turn:0,winner:null,line:null,last:null,moves:0,status:"playing"})}
// 한 줄에 같은 색이 몇 개 이어지는지 (idx 칸에 color가 놓였다고 가정)
function run(board,idx,color){
  const r0=Math.floor(idx/N),c0=idx%N;let best=null;
  for(const [dr,dc] of DIRS){
    let cells=[idx];
    for(const sg of[1,-1]){
      let r=r0+sg*dr,c=c0+sg*dc;
      while(r>=0&&r<N&&c>=0&&c<N&&board[r*N+c]===color){cells.push(r*N+c);r+=sg*dr;c+=sg*dc}
    }
    if(!best||cells.length>best.length)best=cells;
  }
  return best;
}
// 놓은 뒤 이겼는지 확인
function placeStone(g,idx,who){
  if(g.status!=="playing"||g.turn!==who||g.board[idx]!==0)return false;
  const color=who+1;g.board[idx]=color;g.last=idx;g.moves++;
  const line=run(g.board,idx,color);
  if(line.length>=5){g.status="over";g.winner=who;g.line=line;addWinLog(g,who);return true}
  if(g.moves>=CELLS){g.status="over";g.winner=-1;return true}
  g.turn=1-who;return true}
function addWinLog(g,who){g.log=[`${nm(g,who)}가 다섯 개를 이었어요!`]}

/* ---------- 저장/행동 ---------- */
async function save(g){
  if(g.status==="over"&&!(S.game&&S.game.status==="over"))reportResult(g);
  if(S.local){S.game=g;render();return}
  S.busy=true;g.updatedAt=Date.now();
  try{await S.db.doc("om_games/"+g.code).set(g)}
  catch(e){toast(e&&e.code==="invalid_argument"?permMsg:"저장에 실패했어요. 다시 눌러 주세요.")}
  finally{S.busy=false}
}
function meIdx(){if(S.local)return 0;return S.game?S.game.players.indexOf(S.uid):-1}
async function myPlace(idx){if(S.busy||!S.game)return;const g=clone(S.game);if(placeStone(g,idx,meIdx()))await save(g)}

/* ---------- COM ---------- */
// 칸마다 "내가 두면 얼마나 좋은지(공격)"와 "상대가 두면 얼마나 위험한지(방어)"를 점수로 매겨요.
const LINE_VAL=[0,1,10,120,1200,100000];
function cellScore(board,idx,color){
  const line=run(board,idx,color);
  const cnt=line.length;
  return cnt>=5?100000:LINE_VAL[Math.min(cnt,4)]}
function comMove(g){
  const board=g.board;
  const cand=[];
  for(let i=0;i<CELLS;i++){if(board[i])continue;
    const r=Math.floor(i/N),c=i%N;let near=false;
    for(let dr=-2;dr<=2&&!near;dr++)for(let dc=-2;dc<=2&&!near;dc++){
      const rr=r+dr,cc=c+dc;if(rr<0||rr>=N||cc<0||cc>=N)continue;if(board[rr*N+cc])near=true}
    if(near)cand.push(i)}
  if(!cand.length)return Math.floor(CELLS/2);
  let best=cand[0],bs=-1;
  for(const i of cand){
    const atk=cellScore(board,i,2),def=cellScore(board,i,1);
    const sc=atk*1.05+def*0.95+Math.random()*2;
    if(sc>bs){bs=sc;best=i}}
  return best}
function scheduleBot(){
  const g=S.game;if(!S.local||!g||g.status!=="playing"||g.turn!==1||S.botTimer)return;
  S.botTimer=setTimeout(()=>{S.botTimer=null;const g0=S.game;if(!S.local||!g0||g0.status!=="playing"||g0.turn!==1)return;
    const g=clone(g0);placeStone(g,comMove(g),1);save(g)},450+Math.random()*350)}
function startCom(){
  if(S.unsub){S.unsub();S.unsub=null}S.local=true;S.code=null;
  const name=myName()||"나";if(myName())lsSet("om.name",name);
  const g=newGame("COM","me",name);g.players=["me","com"];g.names=[name,"COM"];startPlay(g);save(g)}

/* ---------- 방 ---------- */
async function createRoom(){
  const name=myName();if(!name){$("lobbyErr").textContent="닉네임을 먼저 적어 주세요.";return}
  lsSet("om.name",name);$("lobbyErr").textContent="";$("btnCreate").disabled=true;
  try{for(let t=0;t<8;t++){const code=String(1000+Math.floor(Math.random()*9000));const ref=S.db.doc("om_games/"+code);const snap=await ref.get();const d=snap.exists?snap.data():null;
      if(d&&d.status!=="over"&&Date.now()-(d.updatedAt||0)<6*3600e3)continue;await ref.set(newGame(code,S.uid,name));enter(code);return}
    $("lobbyErr").textContent="빈 방 코드를 찾지 못했어요. 한 번 더 눌러 주세요."}
  catch(e){$("lobbyErr").textContent=e&&e.code==="invalid_argument"?permMsg:"방을 만들지 못했어요. 다시 시도해 주세요."}
  finally{$("btnCreate").disabled=false}}
async function joinRoom(){
  const name=myName(),code=$("joinCode").value.trim();
  if(!name){$("lobbyErr").textContent="닉네임을 먼저 적어 주세요.";return}
  if(!/^\d{4}$/.test(code)){$("lobbyErr").textContent="방 코드는 숫자 4자리예요.";return}
  lsSet("om.name",name);$("lobbyErr").textContent="";$("btnJoin").disabled=true;
  try{const ref=S.db.doc("om_games/"+code);const snap=await ref.get();
    if(!snap.exists){$("lobbyErr").textContent="그 코드로 열린 방이 없어요.";return}
    const g=clone(snap.data());if(g.players.includes(S.uid)){enter(code);return}
    if(g.players[1]){$("lobbyErr").textContent="이미 두 명이 게임 중인 방이에요.";return}
    g.players[1]=S.uid;g.names[1]=name;startPlay(g);g.updatedAt=Date.now();await ref.set(g);enter(code)}
  catch(e){$("lobbyErr").textContent=e&&e.code==="invalid_argument"?permMsg:"입장하지 못했어요. 다시 시도해 주세요."}
  finally{$("btnJoin").disabled=false}}
function enter(code){
  if(S.unsub){S.unsub();S.unsub=null}S.local=false;S.code=code;S.game=null;lsSet("om.code",code);
  S.unsub=S.db.doc("om_games/"+code).onSnapshot(snap=>{if(!snap.exists){leave("방이 사라졌어요.");return}S.game=snap.data();render()},()=>toast("연결이 끊겼어요. 페이지를 새로 열어 주세요."))}
function leave(msg){
  if(S.unsub){S.unsub();S.unsub=null}if(S.botTimer){clearTimeout(S.botTimer);S.botTimer=null}
  if(!S.local)lsSet("om.code",null);S.local=false;S.code=null;S.game=null;show("lobby");if(msg)toast(msg)}

/* ---------- 렌더 ---------- */
const cells=[];
function buildBoard(){
  const b=$("board");b.innerHTML="";
  for(let i=0;i<CELLS;i++){
    const r=Math.floor(i/N),c=i%N;
    const el=document.createElement("button");el.className="cell empty";el.dataset.i=i;
    if(r===0)el.classList.add("edge-t");if(r===N-1)el.classList.add("edge-b");
    if(c===0)el.classList.add("edge-l");if(c===N-1)el.classList.add("edge-r");
    const s=document.createElement("span");s.className="s";el.append(s);
    el.onclick=()=>{const g=S.game;if(!g||g.status!=="playing"||S.busy)return;if(meIdx()!==g.turn)return;if(g.board[i])return;myPlace(i)};
    b.append(el);cells[i]=el}
}
function render(){
  const g=S.game;if(!g)return;
  if(g.status==="waiting"){if(meIdx()!==0){leave("방에 들어갈 수 없어요.");return}show("waiting");$("waitCode").textContent=g.code;return}
  const i=meIdx();if(i<0){leave("이미 두 명이 게임 중인 방이에요.");return}
  show("table");const j=1-i;
  $("tCode").textContent=S.local?"COM 대결":"방 "+g.code;
  $("myName").textContent=nm(g,i)==="나"?"나":nm(g,i)+" (나)";$("oppName").textContent=nm(g,j);
  $("myStone").className="stone "+(i===0?"b":"w");$("oppStone").className="stone "+(j===0?"b":"w");
  $("myInfo").textContent=i===0?"흑":"백";$("oppInfo").textContent=j===0?"흑":"백";
  $("meSeat").classList.toggle("active",g.status==="playing"&&g.turn===i);
  $("oppSeat").classList.toggle("active",g.status==="playing"&&g.turn===j);
  // 판
  const lineSet=new Set(g.line||[]);
  for(let k=0;k<CELLS;k++){
    const el=cells[k];if(!el)continue;const v=g.board[k];
    el.className="cell "+(v===1?"b":v===2?"w":"empty")+(g.last===k?" last":"")+(lineSet.has(k)?" win":"");
    el.disabled=g.status!=="playing"||v!==0||meIdx()!==g.turn;
  }
  // 상태 문구
  const st=$("status");st.className="status";
  if(g.status==="playing"){
    if(g.turn===i){st.className="status mine";st.textContent="내 차례예요"}
    else st.textContent=S.local?"COM이 고르는 중":`${nm(g,j)}의 차례예요`;
  }else if(g.status==="over"){st.textContent=""}
  // 결과
  const rb=$("resultBox");
  if(g.status==="over"){
    rb.hidden=false;const big=$("resultBig");
    if(g.winner<0){big.className="resultbox draw";big.textContent="무승부"}
    else if(g.winner===i){big.className="resultbox win";big.textContent="승리!"}
    else{big.className="resultbox lose";big.textContent="패배"}
    $("resultText").textContent=g.winner<0?"판이 가득 찼어요.":`${nm(g,g.winner)}가 다섯 개를 이었어요.`;
  }else rb.hidden=true;
  $("btnAgain").disabled=S.busy;
  const lg=$("log");lg.innerHTML="";(g.log||[]).forEach(m=>{const li=document.createElement("li");li.textContent=m;lg.append(li)});
  scheduleBot()}

function bootSV(root,api){

const $=id=>root.getElementById(id);
const S={db:null,uid:null,code:null,game:null,unsub:null,busy:false,local:false,botTimer:null};
const START=1000, ANTE=10, HANDS=10, MIN_CHIPS=170, SUITS=["♠","♥","♦","♣"];
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function show(id){for(const s of["lobby","waiting","table"])$(s).hidden=s!==id}
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2400)}
const clone=o=>JSON.parse(JSON.stringify(o));
const nm=(g,i)=>g.names[i]||(i===0?"방장":"도전자");
function myName(){return($("nick").value.trim()||"").slice(0,12)}
const permMsg="이 페이지에 쓸 권한이 없어요. 공유 받을 때 편집 권한이 필요해요.";

/* ---------- 카드 & 족보 ---------- */
// 카드는 0~51 숫자. 숫자 = 무늬*13 + (랭크-2), 랭크는 2~14(A)
const rankOf=id=>id%13+2, suitOf=id=>Math.floor(id/13);
const cardText=id=>{const r=rankOf(id);return ({14:"A",13:"K",12:"Q",11:"J"}[r]||String(r))+SUITS[suitOf(id)]};
const isRed=id=>suitOf(id)===1||suitOf(id)===2;
function cmpS(a,b){for(let k=0;k<Math.max(a.length,b.length);k++){const x=a[k]??-1,y=b[k]??-1;if(x!==y)return x-y}return 0}
function combos(arr,k){
  if(k===0)return[[]];if(arr.length<k)return[];
  const [h,...t]=arr;return[...combos(t,k-1).map(c=>[h,...c]),...combos(t,k)]}
// 5장 족보 점수: [족보번호, 타이브레이크...] (높을수록 강함). 8=스트레이트플러시 ... 0=하이카드
function eval5(ids){
  const rs=ids.map(rankOf).sort((a,b)=>b-a);
  const flush=ids.every(id=>suitOf(id)===suitOf(ids[0]));
  const uniq=new Set(rs).size;let straightHigh=0;
  if(uniq===5){if(rs[0]-rs[4]===4)straightHigh=rs[0];else if(rs.join()==="14,5,4,3,2")straightHigh=5}
  const cnt={};rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);
  const groups=Object.keys(cnt).map(Number).map(r=>[cnt[r],r]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]);
  if(straightHigh&&flush)return[8,straightHigh];
  if(groups[0][0]===4)return[7,groups[0][1],groups[1][1]];
  if(groups[0][0]===3&&groups[1][0]===2)return[6,groups[0][1],groups[1][1]];
  if(flush)return[5,...rs];
  if(straightHigh)return[4,straightHigh];
  if(groups[0][0]===3)return[3,groups[0][1],...groups.slice(1).map(x=>x[1])];
  if(groups[0][0]===2&&groups[1][0]===2)return[2,groups[0][1],groups[1][1],groups[2][1]];
  if(groups[0][0]===2)return[1,groups[0][1],...groups.slice(1).map(x=>x[1])];
  return[0,...rs]}
// 가진 카드 중 가장 강한 족보. 5장 미만이면 같은 숫자 묶음만 봐요.
function bestOf(ids){
  if(ids.length>=5){let best=null;combos(ids,5).forEach(c=>{const s=eval5(c);if(!best||cmpS(s,best)>0)best=s});return best}
  const cnt={};ids.forEach(id=>{const r=rankOf(id);cnt[r]=(cnt[r]||0)+1});
  const groups=Object.keys(cnt).map(Number).map(r=>[cnt[r],r]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]);
  const pairs=groups.filter(x=>x[0]===2).length;
  const cat=groups[0][0]>=4?7:groups[0][0]===3?3:pairs>=2?2:groups[0][0]===2?1:0;
  return[cat,...groups.map(x=>x[1])]}
// 족보를 이루는 카드와 족보 점수. 원페어·투페어·트리플·포카드는 짝 카드만(키커 제외), 하이카드는 가장 높은 카드 한 장
function bestCombo(ids){
  let best=null,bc=null;
  if(ids.length<5){best=bestOf(ids);bc=ids}
  else combos(ids,5).forEach(c=>{const s=eval5(c);if(!best||cmpS(s,best)>0){best=s;bc=c}});
  const cat=best[0],cnt={};bc.forEach(id=>{const r=rankOf(id);cnt[r]=(cnt[r]||0)+1});
  let cards;
  if(cat===0)cards=[bc.slice().sort((x,y)=>rankOf(y)-rankOf(x))[0]];
  else if(cat>=4)cards=bc;                       // 스트레이트·플러시·풀하우스·스트레이트플러시: 5장 전부
  else cards=bc.filter(id=>cnt[rankOf(id)]>=2);  // 원페어·투페어·트리플·포카드: 짝 카드만
  return{score:best,cards}}
const rankTxt=r=>({14:"A",13:"K",12:"Q",11:"J"}[r]||String(r));
function handName(sc){return sc[0]===2?`${rankTxt(sc[1])}투페어`:CAT_NAME[sc[0]]}
const CAT_NAME=["하이카드","원페어","투페어","트리플","스트레이트","플러시","풀하우스","포카드","스트레이트 플러시"];

/* ---------- 규칙 ---------- */
function newGame(code,uid,name){return{code,players:[uid,null],names:[name,""],status:"waiting",
  hand:0,chips:[START,START],deal:[[],[]],st:null,pot:0,result:null,winner:null,log:[],updatedAt:Date.now()}}
const limitOf=street=>street<2?10:20;
// 보이는 카드 기준으로 누가 먼저 베팅할지 정해요 (같으면 지난 번 순서 유지)
function upCards(g,p,street){return g.deal[p].slice(2,Math.min(6,3+street))}
function firstActor(g,street,prev){
  const a=bestOf(upCards(g,0,street)),b=bestOf(upCards(g,1,street));
  const c=cmpS(a,b);return c>0?0:c<0?1:prev}
function addLog(g,m){g.log=[m,...(g.log||[])].slice(0,10)}
// 이벤트 판: 10판 중 랜덤 2판. 노다이판(다이 불가) 또는 2배판(이긴 사람이 팟의 2배)
// 10판 중 랜덤으로 5판이 이벤트 판이 되고, 종류도 랜덤
const EVT_TYPES=["nofold","double","comeback","recovery"];
const EVT_COUNT=5;
function makeEvents(){
  const hs=[];while(hs.length<EVT_COUNT){const h=1+Math.floor(Math.random()*HANDS);if(!hs.includes(h))hs.push(h)}
  // 역전 찬스는 4판부터만 나와요 (처음부터 뒤처질 일은 없으니까)
  return hs.sort((a,b)=>a-b).map(h=>{const pool=h<4?EVT_TYPES.filter(t=>t!=="comeback"):EVT_TYPES;return{h,t:pool[Math.floor(Math.random()*pool.length)]}})}
const EVT_NAME={nofold:"노다이판 · 다이 불가",double:"2배 이벤트 · 승자 2배",comeback:"역전 찬스 · 뒤처진 승자 3배",recovery:"회복 판 · 패자 팟 절반 환급"};
// 이긴 사람이 받는 배수 (역전 찬스: 판 시작 때 뒤처져 있었던 경우만 3배)
function awardMult(g,w){
  if(g.evt==="double")return 2;
  if(g.evt==="comeback")return g.hstart[w]<g.hstart[1-w]?3:1;
  return 1}
// 회복 판: 진 사람이 팟의 절반을 돌려받아요
function rebate(g,loser){if(g.evt==="recovery")g.chips[loser]+=Math.floor(g.pot/2)}
function startHand(g){
  g.hand++;
  if(g.hand>HANDS||g.chips[0]<MIN_CHIPS||g.chips[1]<MIN_CHIPS){finishMatch(g);return}
  if(!g.events)g.events=makeEvents();
  g.evt=(g.events.find(e=>e.h===g.hand)||{}).t||null;
  const deck=Array.from({length:52},(_,i)=>i);
  for(let i=51;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
  g.deal=[deck.slice(0,7),deck.slice(7,14)];
  g.hstart=g.chips.slice();
  g.chips=g.chips.map(c=>c-ANTE);g.pot=ANTE*2;g.result=null;g.winner=null;
  const first=g.hand%2===1?0:1;
  g.st={street:0,bets:[0,0],acted:[false,false],raises:0,turn:firstActor(g,0,first),first};
  g.status="playing";addLog(g,`${g.hand}판 시작 (앤티 ${ANTE}씩)`+(g.evt?` · 이벤트: ${EVT_NAME[g.evt]}`:""));
}
function finishMatch(g){
  g.status="over";g.st=null;
  g.winner=g.chips[0]===g.chips[1]?-1:(g.chips[0]>g.chips[1]?0:1);
  addLog(g,g.winner<0?"최종 무승부":`${nm(g,g.winner)}의 최종 승리!`);
}
function endHand(g,winner,reason,detail){
  g.status="handEnd";g.st=null;g.pot=0;
  g.result={winner,reason,detail};
  g.winner=winner;
  addLog(g,winner<0?`${g.hand}판 무승부`:`${g.hand}판: ${nm(g,winner)} 승 (${reason==="fold"?"다이":"족보"})`);
}
function showdown(g){
  const h0=bestOf(g.deal[0]),h1=bestOf(g.deal[1]);const c=cmpS(h0,h1);
  const pot=g.pot;
  if(c===0){g.chips[0]+=Math.floor(pot/2);g.chips[1]+=pot-Math.floor(pot/2);endHand(g,-1,"tie",{h0,h1,pot})}
  else{const w=c>0?0:1;g.chips[w]+=pot*awardMult(g,w);rebate(g,1-w);endHand(g,w,"showdown",{h0,h1,pot})}
}
// 베팅 한 번 처리. kind: fold | check | call | bet | raise
function act(g,who,kind){
  if(g.status!=="playing"||!g.st||g.st.turn!==who)return false;
  const st=g.st,o=1-who,toCall=st.bets[o]-st.bets[who],b=limitOf(st.street);
  if(kind==="fold"){if(g.evt==="nofold")return false;g.chips[o]+=g.pot*awardMult(g,o);rebate(g,who);addLog(g,`${nm(g,who)} 다이`);endHand(g,o,"fold",{folder:who,pot:g.pot,street:st.street});return true}
  if(kind==="check"){if(toCall!==0)return false;st.acted[who]=true;addLog(g,`${nm(g,who)} 체크`)}
  if(kind==="call"){if(toCall<=0)return false;g.chips[who]-=toCall;st.bets[who]+=toCall;g.pot+=toCall;st.acted[who]=true;addLog(g,`${nm(g,who)} 콜 ${toCall}`)}
  if(kind==="bet"){if(toCall!==0||st.raises>=2)return false;g.chips[who]-=b;st.bets[who]+=b;g.pot+=b;st.raises++;st.acted[who]=true;st.acted[o]=false;addLog(g,`${nm(g,who)} 베팅 ${b}`)}
  if(kind==="raise"){if(toCall<=0||st.raises>=2)return false;const amt=toCall+b;g.chips[who]-=amt;st.bets[who]+=amt;g.pot+=amt;st.raises++;st.acted[who]=true;st.acted[o]=false;addLog(g,`${nm(g,who)} 레이즈 ${amt}`)}
  if(st.acted[0]&&st.acted[1]&&st.bets[0]===st.bets[1])nextStreet(g);
  else st.turn=o;
  return true}
function nextStreet(g){
  const st=g.st;
  if(st.street>=4){showdown(g);return}
  st.street++;st.bets=[0,0];st.acted=[false,false];st.raises=0;
  st.turn=firstActor(g,st.street,st.first);
  addLog(g,`${st.street+1}번째 카드`);
}
function visibleFor(g,p,street){ // 상대에게 보이는 카드: 2번째 자리(인덱스2~5)만
  return g.deal[p].slice(0,3+street).map((id,idx)=>({id,up:idx>=2&&idx<=5}))}

/* ---------- 저장/행동 ---------- */
async function save(g){
  if(g.status==="over"&&!(S.game&&S.game.status==="over"))reportResult(g);
  if(S.local){S.game=g;render();return}
  S.busy=true;g.updatedAt=Date.now();
  try{await S.db.doc("sv_games/"+g.code).set(g)}
  catch(e){toast(e&&e.code==="invalid_argument"?permMsg:"저장에 실패했어요. 다시 눌러 주세요.")}
  finally{S.busy=false}
}
function meIdx(){if(S.local)return 0;return S.game?S.game.players.indexOf(S.uid):-1}
async function myAct(kind){if(S.busy||!S.game)return;const g=clone(S.game);if(act(g,meIdx(),kind))await save(g)}
async function myNext(){if(S.busy||!S.game)return;const g0=S.game;if(g0.status==="over")return;const g=clone(g0);
  if(g0.status==="waiting")return;if(g0.status!=="handEnd")return;startHand(g);await save(g)}

/* ---------- COM ---------- */
function botAct(g){
  const st=g.st,o=0,toCall=st.bets[o]-st.bets[1],b=limitOf(st.street);
  const cat=bestOf(g.deal[1].slice(0,3+st.street))[0];
  const canRaise=st.raises<2;
  if(toCall>0){
    if(cat===0&&Math.random()<0.6)return"fold";
    if(canRaise&&cat>=2&&Math.random()<0.5)return"raise";
    return"call"}
  if(canRaise&&cat>=1&&Math.random()<0.55)return"bet";
  if(canRaise&&Math.random()<0.07)return"bet";
  return"check"}
function scheduleBot(){
  const g=S.game;if(!S.local||!g||g.status!=="playing"||!g.st||g.st.turn!==1||S.botTimer)return;
  S.botTimer=setTimeout(()=>{S.botTimer=null;const g0=S.game;if(!S.local||!g0||g0.status!=="playing"||!g0.st||g0.st.turn!==1)return;
    const g=clone(g0);act(g,1,botAct(g));save(g)},650+Math.random()*450)}
function startCom(){
  if(S.unsub){S.unsub();S.unsub=null}S.local=true;S.code=null;
  const name=myName()||"나";if(myName())lsSet("sv.name",name);
  const g=newGame("COM","me",name);g.players=["me","com"];g.names=[name,"COM"];
  startHand(g);save(g)}

/* ---------- 방 ---------- */
async function createRoom(){
  const name=myName();if(!name){$("lobbyErr").textContent="닉네임을 먼저 적어 주세요.";return}
  lsSet("sv.name",name);$("lobbyErr").textContent="";$("btnCreate").disabled=true;
  try{for(let t=0;t<8;t++){const code=String(1000+Math.floor(Math.random()*9000));const ref=S.db.doc("sv_games/"+code);const snap=await ref.get();const d=snap.exists?snap.data():null;
      if(d&&d.status!=="over"&&Date.now()-(d.updatedAt||0)<6*3600e3)continue;await ref.set(newGame(code,S.uid,name));enter(code);return}
    $("lobbyErr").textContent="빈 방 코드를 찾지 못했어요. 한 번 더 눌러 주세요."}
  catch(e){$("lobbyErr").textContent=e&&e.code==="invalid_argument"?permMsg:"방을 만들지 못했어요. 다시 시도해 주세요."}
  finally{$("btnCreate").disabled=false}}
async function joinRoom(){
  const name=myName(),code=$("joinCode").value.trim();
  if(!name){$("lobbyErr").textContent="닉네임을 먼저 적어 주세요.";return}
  if(!/^\d{4}$/.test(code)){$("lobbyErr").textContent="방 코드는 숫자 4자리예요.";return}
  lsSet("sv.name",name);$("lobbyErr").textContent="";$("btnJoin").disabled=true;
  try{const ref=S.db.doc("sv_games/"+code);const snap=await ref.get();
    if(!snap.exists){$("lobbyErr").textContent="그 코드로 열린 방이 없어요.";return}
    const g=clone(snap.data());if(g.players.includes(S.uid)){enter(code);return}
    if(g.players[1]){$("lobbyErr").textContent="이미 두 명이 게임 중인 방이에요.";return}
    g.players[1]=S.uid;g.names[1]=name;startHand(g);g.updatedAt=Date.now();await ref.set(g);enter(code)}
  catch(e){$("lobbyErr").textContent=e&&e.code==="invalid_argument"?permMsg:"입장하지 못했어요. 다시 시도해 주세요."}
  finally{$("btnJoin").disabled=false}}
function enter(code){
  if(S.unsub){S.unsub();S.unsub=null}S.local=false;S.code=code;S.game=null;lsSet("sv.code",code);
  S.unsub=S.db.doc("sv_games/"+code).onSnapshot(snap=>{if(!snap.exists){leave("방이 사라졌어요.");return}S.game=snap.data();render()},()=>toast("연결이 끊겼어요. 페이지를 새로 열어 주세요."))}
function leave(msg){
  if(S.unsub){S.unsub();S.unsub=null}if(S.botTimer){clearTimeout(S.botTimer);S.botTimer=null}
  if(!S.local)lsSet("sv.code",null);S.local=false;S.code=null;S.game=null;show("lobby");if(msg)toast(msg)}

/* ---------- 렌더 ---------- */
function cardEl(id,opts){
  const d=document.createElement("div");
  if(id==null){d.className="card empty";return d}
  if(opts&&opts.down){d.className="card down";return d}
  d.className="card"+(isRed(id)?" red":"")+(opts&&opts.small?" small":"")+(opts&&opts.hl?" hl":"");
  d.textContent=cardText(id);return d}
function fillCards(el,items){el.innerHTML="";items.forEach(x=>el.append(cardEl(x.id,x)))}
function render(){
  const g=S.game;if(!g)return;
  if(g.status==="waiting"){if(meIdx()!==0){leave("방에 들어갈 수 없어요.");return}show("waiting");$("waitCode").textContent=g.code;return}
  const i=meIdx();if(i<0){leave("이미 두 명이 게임 중인 방이에요.");return}
  show("table");const j=1-i;
  const st=g.st;const R=g.result||{};
  const street=st?st.street:(R.detail&&R.detail.street!=null?R.detail.street:0);
  $("tCode").textContent=S.local?"COM 대결":"방 "+g.code;
  $("tHand").textContent=`${Math.max(1,Math.min(g.hand,HANDS))}/${HANDS}판`;
  $("myName").textContent=nm(g,i)==="나"?"나":nm(g,i)+" (나)";$("oppName").textContent=nm(g,j);
  $("myChips").textContent=g.chips[i]+"칩";$("oppChips").textContent=g.chips[j]+"칩";
  $("pot").textContent=(g.pot||0)+"칩";
  $("street").textContent=(st?`${street+1}/5 단계 · 베팅 ${limitOf(street)}칩`:"")+(g.evt?` · ${EVT_NAME[g.evt]}`:"");
  const showAll=(g.status==="handEnd"||g.status==="over")&&(R.reason==="showdown"||R.reason==="tie");
  // 내 카드: 전부 보임
  // 판이 쇼다운으로 끝나면 각자 족보를 만드는 5장을 빨간 테두리로 표시
  const showHL=showAll&&g.result&&(g.result.reason==="showdown"||g.result.reason==="tie");
  const hlMe=new Set(),hlOpp=new Set();let meTag="",oppTag="";
  if(showHL){
    const a=bestCombo(g.deal[i].slice(0,7)),b=bestCombo(g.deal[j].slice(0,7));
    a.cards.forEach(id=>hlMe.add(id));b.cards.forEach(id=>hlOpp.add(id));
    meTag=handName(a.score);oppTag=handName(b.score);
  }else if(g.status==="playing"){
    // 진행 중에는 내가 지금까지 받은 카드로 만든 족보를 테두리로 보여 줘요 (상대 카드는 알려주지 않아요)
    const mine=g.deal[i].slice(0,3+street);
    if(mine.length){const a=bestCombo(mine);a.cards.forEach(id=>hlMe.add(id));meTag=handName(a.score)}
  }
  $("myHand").textContent=meTag;$("oppHand").textContent=oppTag;
  fillCards($("myCards"),g.deal[i].slice(0,showAll?7:3+street).map((id,idx)=>({id,small:false,hl:hlMe.has(id)})));
  // 상대 카드: 공개된 것만 보이고, 나머지는 뒷면 (판이 끝나면 전부 공개)
  const oppDealt=g.deal[j].slice(0,showAll?7:3+street);
  fillCards($("oppCards"),oppDealt.map((id,idx)=>{
    const up=idx>=2&&idx<=5;
    return showAll||up?{id,small:true,hl:hlOpp.has(id)}:{id,down:true,small:true}}));
  $("meSeat").classList.toggle("active",g.status==="playing"&&st&&st.turn===i);
  $("oppSeat").classList.toggle("active",g.status==="playing"&&st&&st.turn===j);
  // 상태 문구
  const stEl=$("status");stEl.className="status";
  if(g.status==="playing"&&st){
    if(st.turn===i){stEl.className="status mine";stEl.textContent="내 차례예요"}
    else stEl.textContent=S.local?"COM이 고민 중":`${nm(g,j)}의 차례예요`;
  }else stEl.textContent="";
  // 버튼
  const my=g.status==="playing"&&st&&st.turn===i&&!S.busy;
  const toCall=st?st.bets[j]-st.bets[i]:0,b=limitOf(street);
  const canBet=my&&toCall===0&&st&&st.raises<2, canRaise=my&&toCall>0&&st&&st.raises<2;
  $("btnCall").textContent=toCall>0?`콜 (${toCall})`:"체크";
  $("btnCall").disabled=!my||(toCall>0?false:false);
  $("btnCall").onclick=()=>myAct(toCall>0?"call":"check");
  $("btnCall").disabled=!my;
  $("btnBet").textContent=toCall>0?(st&&st.raises<2?`레이즈 (${toCall+b})`:"레이즈 불가"):(st&&st.raises<2?`베팅 (${b})`:"베팅 불가");
  $("btnBet").disabled=!(canBet||canRaise);
  $("btnBet").onclick=()=>myAct(toCall>0?"raise":"bet");
  $("btnFold").disabled=!my||g.evt==="nofold";   // 체크할 수 있을 때도 언제든 다이 가능 (노다이판 제외)
  $("btnFold").onclick=()=>myAct("fold");
  $("actions").hidden=g.status!=="playing";
  // 결과
  const rb=$("resultBox");
  if(g.status==="handEnd"||g.status==="over"){
    rb.hidden=false;const big=$("resultBig");const r=g.result||{};
    if(g.status==="over"){big.className="resultbox "+(g.winner<0?"draw":g.winner===i?"win":"lose");big.textContent=g.winner<0?"최종 무승부":g.winner===i?"최종 승리!":"최종 패배"}
    // 이번 판에서 얻거나 잃은 칩을 큼직하게 표시 (판 시작 칩 대비)
    const gain=(g.hstart&&g.hstart[i]!=null)?g.chips[i]-g.hstart[i]:null;
    const gTxt=gain==null?"":` ${gain>=0?"+":""}${gain}칩`;
    if(r.winner==null||r.winner<0){big.className="resultbox draw";big.textContent="무승부"+gTxt}
    else{big.className="resultbox "+(r.winner===i?"win":"lose");big.textContent=(r.winner===i?"승리!":"패배")+gTxt}
    let t="";
    if(g.status==="handEnd"&&r.reason==="showdown"&&r.detail){
      const mine=i===0?r.detail.h0:r.detail.h1,theirs=i===0?r.detail.h1:r.detail.h0;
      t=`내 족보 ${handName(mine)} · 상대 ${handName(theirs)}`}
    else if(r.reason==="fold")t=r.detail&&r.detail.folder===i?"내가 다이했어요":"상대가 다이했어요";
    else if(r.reason==="tie")t="족보가 같아서 판돈을 나눴어요";
    if(g.status==="over")t+=` · 최종 칩 ${g.chips[i]} : ${g.chips[j]}`;
    $("resultText").textContent=t;
    $("btnNext").textContent=g.status==="over"?"처음 화면으로":(g.hand>=HANDS?"결과 보기":"다음 판");
    $("btnNext").disabled=S.busy;
    $("btnNext").onclick=g.status==="over"?()=>leave(S.local?"COM 대결을 마쳤어요.":"대결을 마쳤어요."):myNext;
  }else rb.hidden=true;
  const lg=$("log");lg.innerHTML="";(g.log||[]).forEach(m=>{const li=document.createElement("li");li.textContent=m;lg.append(li)});
  scheduleBot()}

/* ---------- 이벤트 & 시작 ---------- */
$("btnCom").onclick=startCom;$("btnCreate").onclick=createRoom;$("btnJoin").onclick=joinRoom;
$("joinCode").addEventListener("keydown",e=>{if(e.key==="Enter")joinRoom()});

$("btnLeave").onclick=()=>leave(S.local?"COM 대결을 끝냈어요.":"방에서 나왔어요. 같은 코드로 다시 들어올 수 있어요.");
$("btnCopy").onclick=()=>{const c=S.code||"";if(navigator.clipboard)navigator.clipboard.writeText(c).then(()=>toast("코드를 복사했어요"),()=>toast(`코드: ${c}`));else toast(`코드: ${c}`)};

$("nick").value=lsGet("sv.name")||"";
show("lobby");
(async()=>{
  const db=window.claude&&window.claude.use?await window.claude.use("db"):null;
  if(!db){$("btnCreate").disabled=true;$("btnJoin").disabled=true;$("joinCode").disabled=true;

  if(user){const w=await user.can("data.write");if(w===false)$("lobbyErr").textContent="보기 전용으로 열려 있어요. 둘이서 하려면 편집 권한으로 공유받아야 해요."}
  const saved=lsGet("sv.code");if(saved&&!S.local)enter(saved);
})();

function reportResult(g){try{api.record({game:"sv",local:S.local,players:g.players,names:g.names,winner:g.winner,me:meIdx()})}catch(e){}}
root.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>api.home());

}

(function(){
  const g=id=>document.getElementById(id);
  const ls=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
  const GAMES=[
    {key:"poker",pick:"pickPoker",tag:"tagPoker",ls:"ip.code",boot:bootPoker},
    {key:"bw",pick:"pickBW",tag:"tagBW",ls:"bw.code",boot:bootBW},
    {key:"bb",pick:"pickBB",tag:"tagBB",ls:"bb.code",boot:bootBB},
    {key:"om",pick:"pickOM",tag:"tagOM",ls:"om.code",boot:bootOM},
    {key:"sv",pick:"pickSV",tag:"tagSV",ls:"sv.code",boot:bootSV},
  ];
  function open(which){
    g("home").hidden = which!==null;
    g("host-stock").hidden = which!=="stock";
    g("host-escape").hidden = which!=="escape";
    GAMES.forEach(x=>{g("host-"+x.key).hidden = which!==x.key; if(which===null) g(x.tag).hidden=!ls(x.ls)});
    const cur=GAMES.find(x=>x.key===which);let bg="";
    if(cur){try{bg=getComputedStyle(g("host-"+cur.key).shadowRoot.querySelector(".gbody")).backgroundColor}catch(e){}}
    document.body.style.background=which==="stock"?"#0b0f1c":which==="escape"?"#120e0b":bg;
    if(which==="stock")stockGate();
    if(which==="escape"&&!g("escFrame").getAttribute("srcdoc"))g("escFrame").srcdoc=ESC_DOC;
    if(which===null)renderStats();
    window.scrollTo(0,0);
  }
  /* ---------- 전적 ---------- */
  const GNAME={poker:"인디언 포커",bw:"흑과백",bb:"숫자야구",om:"오목",sv:"세븐 포커"};
  const ST={db:null,uid:null,ready:null};
  ST.ready=(async()=>{try{
    const db=window.claude&&window.claude.use?await window.claude.use("db"):null;if(!db)return;ST.db=db;
    const user=await window.claude.use("user");ST.uid=user?await user.id():null}catch(e){}})();
  const lsj=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
  const lsw=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  async function loadCom(){await ST.ready;
    if(ST.db&&ST.uid){try{const s=await ST.db.doc("data/users/"+ST.uid+"/com").get();if(s.exists)return s.data()}catch(e){}}
    return lsj("stats.com",{})}
  let comWrite=Promise.resolve();
  async function record(r){await ST.ready;
    if(r.local){comWrite=comWrite.then(async()=>{
        const c=await loadCom();const x=c[r.game]||{w:0,l:0,d:0};
        if(r.winner<0)x.d++;else if(r.winner===r.me)x.w++;else x.l++;c[r.game]=x;
        lsw("stats.com",c);
        if(ST.db&&ST.uid){try{await ST.db.doc("data/users/"+ST.uid+"/com").set(c)}catch(e){}}});
      return comWrite}
    if(!ST.db||!r.players||!r.players[0]||!r.players[1])return;
    try{await ST.db.collection("records").add({game:r.game,players:r.players,names:r.names,winner:r.winner,at:Date.now()})}catch(e){}}
  function wldEl(x){const d=document.createElement("span");d.className="wld";
    [["w","승"],["l","패"],["d","무"]].forEach(([k,t])=>{if(k==="d"&&!x.d)return;const s=document.createElement("span");s.className=k;s.textContent=`${x[k]}${t}`;d.append(s)});return d}
  function boxEl(title,rows,tot){
    const b=document.createElement("div");b.className="sbox";
    const hd=document.createElement("div");hd.className="hd";const w=document.createElement("span");w.className="who";w.textContent=title;hd.append(w);
    const t=document.createElement("span");t.className="tot";t.textContent=`총 ${tot.w}승 ${tot.l}패${tot.d?` ${tot.d}무`:""}`;hd.append(t);b.append(hd);
    if(tot.w+tot.l>0){const bar=document.createElement("div");bar.className="bar";const i=document.createElement("i");i.style.width=(100*tot.w/(tot.w+tot.l))+"%";bar.append(i);b.append(bar)}
    rows.forEach(([gk,x])=>{const r=document.createElement("div");r.className="srow";const g1=document.createElement("span");g1.className="g";g1.textContent=GNAME[gk];r.append(g1,wldEl(x));b.append(r)});
    return b}
  async function renderStats(){
    await ST.ready;await comWrite;
    const sp=g("statPeople"),sc=g("statCom");
    // 둘이서
    const people={};
    if(ST.db&&ST.uid){try{
      const q=await ST.db.collection("records").where("players","array-contains",ST.uid).limit(1000).get();
      q.docs.map(d=>d.data()).sort((a,b)=>(a.at||0)-(b.at||0)).forEach(r=>{
        const me=r.players.indexOf(ST.uid);if(me<0)return;const opp=r.players[1-me];
        const p=people[opp]||(people[opp]={name:"",games:{}});p.name=(r.names&&r.names[1-me])||p.name||"상대";
        const x=p.games[r.game]||(p.games[r.game]={w:0,l:0,d:0});
        if(r.winner<0)x.d++;else if(r.winner===me)x.w++;else x.l++});
    }catch(e){}}
    sp.innerHTML="";const ppl=Object.values(people);
    if(!ppl.length){const e=document.createElement("p");e.className="sempty";e.textContent="둘이서 한 판을 끝내면 상대별 전적이 여기에 쌓여요.";sp.append(e)}
    ppl.forEach(p=>{const rows=Object.keys(GNAME).filter(k=>p.games[k]).map(k=>[k,p.games[k]]);
      const tot=rows.reduce((a,[,x])=>({w:a.w+x.w,l:a.l+x.l,d:a.d+x.d}),{w:0,l:0,d:0});sp.append(boxEl("vs "+p.name,rows,tot))});
    // COM
    const c=await loadCom();sc.innerHTML="";
    const rows=Object.keys(GNAME).filter(k=>c[k]).map(k=>[k,c[k]]);
    if(rows.length){const tot=rows.reduce((a,[,x])=>({w:a.w+x.w,l:a.l+x.l,d:a.d+x.d}),{w:0,l:0,d:0});sc.append(boxEl("vs COM",rows,tot))}
    else{const e=document.createElement("p");e.className="sempty";e.textContent="COM과 한 판을 끝내면 여기에 기록돼요.";sc.append(e)}
  }
  const api={home:()=>open(null),record};
  GAMES.forEach(x=>{
    const host=g("host-"+x.key); const root=host.attachShadow({mode:"open"});
    root.append(g("tpl-"+x.key).content.cloneNode(true));
    x.boot(root,api);
    g(x.pick).onclick=()=>open(x.key);
  });
  g("pickStock").onclick=()=>open("stock");
  g("pickEscape").onclick=()=>open("escape");
  g("host-escape").querySelector("[data-back-esc]").onclick=()=>open(null);
  g("host-stock").querySelector("[data-back]").onclick=()=>open(null);
  // ── 주식 플래시 비밀번호 게이트 (게임 HTML은 암호화되어 있고, 맞는 비밀번호로만 복호화됨)
  const b64d=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
  async function unlockStock(pw){
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(STOCK_ENC.s),iterations:STOCK_ENC.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(STOCK_ENC.i)},key,b64d(STOCK_ENC.c));
    return new TextDecoder().decode(pt);
  }
  function stockGate(){
    const f=g("stockFrame"); f.removeAttribute("srcdoc"); f.src="about:blank"; f.style.display="none";
    g("stockGate").hidden=false; g("stockPw").value=""; g("stockErr").textContent="";
    setTimeout(()=>g("stockPw").focus(),50);
  }
  g("stockGate").onsubmit=async e=>{
    e.preventDefault();
    const pw=g("stockPw").value;
    if(!window.crypto||!crypto.subtle){ g("stockErr").textContent="이 브라우저에서는 열 수 없어요. (https 주소로 접속해 주세요)"; return; }
    try{
      const doc=await unlockStock(pw);
      g("stockPw").value="";
      g("stockGate").hidden=true;
      const f=g("stockFrame"); f.srcdoc=doc; f.style.display="";
    }catch(err){
      g("stockErr").textContent="비밀번호가 맞지 않아요.";
    }
  };
  if(window.HUB_AUTH&&HUB_AUTH.available){
    g("authRow").hidden=false;
    HUB_AUTH.ready.then(()=>{
      const u=HUB_AUTH.user();
      g("authTxt").textContent=u?((u.displayName||"로그인됨")+" · 기록이 계정에 연결돼요"):"로그인하면 기기가 바뀌어도 기록이 남아요";
      g("authBtn").textContent=u?"로그아웃":"구글로 로그인";
      g("authBtn").onclick=()=>u?HUB_AUTH.logout():HUB_AUTH.login();
    });
  }
  open(null);
})();
</script>
